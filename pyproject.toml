[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmax"
version = "4.3.5"
description = "Evidence-based operations for AI agent fleets: sealed audit trails, SLA-alarmed triage and AI-Act-ready privacy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Swarmax Maintainers" }]
keywords = [
    "ai-agents", "observability", "evidence", "audit", "opentelemetry",
    "llm-ops", "agent-fleet", "compliance", "ai-act", "gdpr", "swarm",
    "multi-agent", "ai-audit", "agent-monitoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
    "Topic :: Security",
    "Topic :: Office/Business :: Financial :: Auditing",
]
dependencies = []  # stdlib-only by design (§7 F0: no external runtime deps)

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
swarmax-init = "swarmax.db:init_main"
swarmax-console = "swarmax.console:main"
swarmax-ingest = "swarmax.otlp:main"
swarmax-otel-relay = "swarmax.bridges.otel_relay:main"

[project.urls]
Homepage = "https://github.com/goun7/Swarmax"
Documentation = "https://github.com/goun7/Swarmax#readme"
Repository = "https://github.com/goun7/Swarmax"
Issues = "https://github.com/goun7/Swarmax/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarmax = ["schema/*.sql", "schema/migrations/*.sql", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# AT-187-BULGU-1: TSA-PKI-uyarısı-sessizce-geçmesin ( fail-closed-zihniyeti;
# sester-deseni). UserWarning-üretim-kodu-tarafından-bilinçli-çıkıyor — testler-
# açıkça-yönetmeli ( pytest.warns-ile-yakalamalı-veya-cert-sağlamalı).
# DeprecationWarning-hariç: datetime.utcnow-stdlib-kullanımdan-kaldırması-
# ( python-3.14) bizim-bağımlılığımız-değil — kendi-sınıfımızda-izole-ele-alınır.
filterwarnings = [
    "error::UserWarning",
    "ignore::DeprecationWarning",
]
